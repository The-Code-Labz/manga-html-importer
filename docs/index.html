  <script id="markdown-source" type="text/markdown"># Manga HTML Importer — API Docs

Parse **readm.today** profile HTML files and extract full manga titles, slugs, cover image paths, and list sections for import into **Manga Sanctuary**.

## Base URL

- Local: `http://localhost:4050`
- Live Forge: `https://manga-html-importer.forge.neurolearninglabs.com`

## Authentication

Set `API_KEY` in your environment to require the `x-api-key` header. If `API_KEY` is not set, all requests are allowed.

```bash
curl -H "x-api-key: $API_KEY" https://manga-html-importer.forge.neurolearninglabs.com/health
```

## Endpoints

### `GET /health`

Returns service status.

```bash
curl https://manga-html-importer.forge.neurolearninglabs.com/health
```

**Response:**

```json
{ "status": "ok", "service": "manga-html-importer" }
```

### `POST /parse`

Upload one or more HTML files as `multipart/form-data`.

```bash
curl -X POST https://manga-html-importer.forge.neurolearninglabs.com/parse \
  -F 'files=@Profile___Read_Manga_Online.html' \
  -F 'files=@Profile___Read_Manga_Online_fav.html' \
  -F 'files=@Profile___Read_Manga_Online_Plan_to_read.html'
```

#### Query parameters

| Param | Type | Description |
|---|---|---|
| `sections` | string | Comma-separated sections to include: `favorites`, `plan-to-read`, `subscriptions` |
| `comick` | boolean | Set `true` to cross-reference comick.dev for titles/covers |
| `comickDelay` | number | Delay between comick requests in ms (default: 500) |
| `comickTimeout` | number | Timeout for comick requests in ms (default: 5000) |

#### Response

```json
{
  "files": [
    {
      "file": "Profile___Read_Manga_Online.html",
      "section": "plan-to-read",
      "entries": 554,
      "duplicatesRemoved": 12,
      "needsReview": 45
    }
  ],
  "totalUnique": 1715,
  "totalNeedsReview": 902,
  "bySection": {
    "plan-to-read": 554,
    "favorites": 1161
  },
  "combined": [
    {
      "title": "I Became the Target of the Harem in Another World",
      "slug": "i-became-the-target-of-the-harem-in-another-world",
      "cover_path": "1721041464.jpg",
      "list_section": "plan-to-read",
      "source_url": "https://readm.today/manga/i-became-the-target-of-the-harem-in-another-world",
      "needs_review": false
    }
  ]
}
```

### `POST /parse-text`

Send raw HTML in the request body.

```bash
curl -X POST https://manga-html-importer.forge.neurolearninglabs.com/parse-text \
  -H 'Content-Type: application/json' \
  -d '{"html": "<html>...</html>", "filename": "profile.html"}'
```

Query parameters are the same as `/parse`.

## Data model

Each parsed manga entry has the following shape:

```json
{
  "title": "I Became the Target of the Harem in Another World",
  "slug": "i-became-the-target-of-the-harem-in-another-world",
  "cover_path": "1721041464.jpg",
  "list_section": "plan-to-read",
  "source_url": "https://readm.today/manga/i-became-the-target-of-the-harem-in-another-world",
  "needs_review": false
}
```

| Field | Description |
|---|---|
| `title` | Full title humanized from the slug |
| `slug` | Canonical slug from the readm.today URL |
| `cover_path` | Cover image filename |
| `list_section` | Which list the manga belongs to |
| `source_url` | Direct readm.today manga URL |
| `needs_review` | `true` if the slug is numeric-only and can't be humanized |

## CLI usage

```bash
npm run start:cli -- path/to/Profile___Read_Manga_Online.html \
  path/to/Profile___Read_Manga_Online_fav.html \
  path/to/Profile___Read_Manga_Online_Plan_to_read.html
```

With comick.dev lookups:

```bash
npm run start:cli -- --comick *.html
```

## Configuration

| Variable | Description |
|---|---|
| `PORT` | Server port (default: 4050) |
| `API_KEY` | Optional `x-api-key` header value |
| `UPLOAD_MAX_FILES` | Max files per upload (default: 10) |
| `UPLOAD_MAX_SIZE_MB` | Max upload size in MB (default: 50) |

## Notes

- Numeric-only slugs like `17318` are flagged with `needs_review: true`.
- The parser ignores `reading-history` and `collections` sections.
- Uploaded files are deleted immediately after parsing.

  <script>
    (function () {
      const source = document.getElementById('markdown-source').textContent.trim();
      const docs = document.getElementById('docs');
      docs.innerHTML = marked.parse(source, { gfm: true, breaks: false });
      docs.querySelectorAll('pre code').forEach((block) => hljs.highlightElement(block));

      const btn = document.getElementById('copy-md');
      const label = document.getElementById('copy-text');
      btn.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(source);
          label.textContent = 'Copied!';
          btn.classList.replace('bg-rose-600', 'bg-emerald-600');
          btn.classList.replace('hover:bg-rose-700', 'hover:bg-emerald-700');
          setTimeout(() => {
            label.textContent = 'Copy Markdown';
            btn.classList.replace('bg-emerald-600', 'bg-rose-600');
            btn.classList.replace('hover:bg-emerald-700', 'hover:bg-rose-700');
          }, 2000);
        } catch (err) {
          label.textContent = 'Copy failed';
          setTimeout(() => { label.textContent = 'Copy Markdown'; }, 2000);
        }
      });
    })();
  </script>
